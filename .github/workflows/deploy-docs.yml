name: Deploy docs

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm --filter @msw-panel/docs build

      - name: Build demo (minimal)
        run: pnpm --filter @msw-panel/example-react-minimal build
        env:
          VITE_BASE_URL: /msw-panel/demo/minimal/
          VITE_SHOW_MSW_PANEL_IN_PRODUCTION: "true"

      - name: Build demo (react)
        run: pnpm --filter @msw-panel/example-react build
        env:
          VITE_BASE_URL: /msw-panel/demo/react/
          VITE_SHOW_MSW_PANEL_IN_PRODUCTION: "true"

      - name: Merge demos into docs output
        run: |
          mkdir -p apps/docs/dist/demo/minimal
          mkdir -p apps/docs/dist/demo/react
          cp -r apps/example-react-minimal/dist/. apps/docs/dist/demo/minimal/
          cp -r apps/example-react/dist/. apps/docs/dist/demo/react/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
