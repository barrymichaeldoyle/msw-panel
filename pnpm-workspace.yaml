packages:
  - packages/*
  - apps/*

allowBuilds:
  esbuild: true
  msw: true
  sharp: true

onlyBuiltDependencies:
  - esbuild
  - msw
  - sharp

overrides:
  yaml: 2.8.4
  msw: 2.15.0
  react: 19.2.7
  react-dom: 19.2.7
  js-yaml: 4.2.0
  # @manypkg/get-packages@1.x asks for read-yaml-file@1, which pulls
  # vulnerable js-yaml@3. read-yaml-file@2 keeps the CommonJS API and uses
  # js-yaml@4.
  read-yaml-file: 2.1.0
  # Force all build-tooling consumers onto the patched esbuild line.
  esbuild: 0.28.1
  # Force jsdom's transitive undici onto the patched line.
  undici: 7.28.0

catalog:
  msw: 2.15.0
  react: 19.2.7
  react-dom: 19.2.7
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3

# Fresh TypeScript 7 platform packages and recent vite patches are safe to
# install before pnpm's default minimumReleaseAge window elapses.
minimumReleaseAgeExclude:
  - typescript
  - "@typescript/typescript-*"
  - vite
  - astro
  - "@astrojs/*"
